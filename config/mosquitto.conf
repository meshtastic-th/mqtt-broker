persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Standard MQTT listener
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT with TLS listener
listener 8883
allow_anonymous false
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2

# --- Bridge Configuration ---
# Example: Bridge to test.meshgw.com for topic msh/TH
connection bridge-to-meshgw
address bridge.meshgw.com:1883
topic msh/TH both 0
remote_username your_remote_user
remote_password your_remote_password
# bridge_cafile /mosquitto/config/certs/ca.crt
